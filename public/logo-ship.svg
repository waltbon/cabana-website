<svg width="557" height="585" viewBox="0 0 557 585" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cabana Logo Ship - Abstract data visualization -->

  <!-- Top star/sparkle -->
  <path d="M519 18L524.5 29.5L536 35L524.5 40.5L519 52L513.5 40.5L502 35L513.5 29.5L519 18Z" fill="#57ff8f"/>

  <!-- Main triangle/sail shape -->
  <path d="M135 0L520 350H135V0Z" fill="url(#shipGradient)" opacity="0.15"/>

  <!-- Data flow lines -->
  <g stroke="#16364d" stroke-width="2" fill="none" opacity="0.3">
    <path d="M200 100L350 200L300 300"/>
    <path d="M250 150L400 250L350 350"/>
    <path d="M300 200L450 300L400 400"/>
  </g>

  <!-- Central geometric pattern -->
  <g transform="translate(144, 205)">
    <!-- Large outer ring -->
    <circle cx="164" cy="190" r="130" stroke="#16364d" stroke-width="3" fill="none" opacity="0.2"/>

    <!-- Medium ring -->
    <circle cx="164" cy="190" r="90" stroke="#0048ff" stroke-width="2" fill="none" opacity="0.3"/>

    <!-- Inner ring -->
    <circle cx="164" cy="190" r="50" stroke="#57ff8f" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Center dot -->
    <circle cx="164" cy="190" r="15" fill="#0048ff" opacity="0.6"/>

    <!-- Data points -->
    <circle cx="100" cy="120" r="8" fill="#57ff8f"/>
    <circle cx="228" cy="120" r="8" fill="#0048ff"/>
    <circle cx="100" cy="260" r="8" fill="#0048ff"/>
    <circle cx="228" cy="260" r="8" fill="#57ff8f"/>
    <circle cx="164" cy="80" r="10" fill="#16364d"/>
    <circle cx="164" cy="300" r="10" fill="#16364d"/>

    <!-- Connecting lines -->
    <line x1="100" y1="120" x2="164" y2="190" stroke="#16364d" stroke-width="1.5" opacity="0.4"/>
    <line x1="228" y1="120" x2="164" y2="190" stroke="#16364d" stroke-width="1.5" opacity="0.4"/>
    <line x1="100" y1="260" x2="164" y2="190" stroke="#16364d" stroke-width="1.5" opacity="0.4"/>
    <line x1="228" y1="260" x2="164" y2="190" stroke="#16364d" stroke-width="1.5" opacity="0.4"/>
    <line x1="164" y1="80" x2="164" y2="190" stroke="#16364d" stroke-width="1.5" opacity="0.4"/>
    <line x1="164" y1="300" x2="164" y2="190" stroke="#16364d" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Floating elements -->
  <circle cx="450" cy="150" r="6" fill="#57ff8f" opacity="0.6"/>
  <circle cx="480" cy="200" r="4" fill="#0048ff" opacity="0.5"/>
  <circle cx="420" cy="180" r="5" fill="#16364d" opacity="0.4"/>

  <defs>
    <linearGradient id="shipGradient" x1="135" y1="0" x2="520" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0048ff"/>
      <stop offset="100%" stop-color="#57ff8f"/>
    </linearGradient>
  </defs>
</svg>
